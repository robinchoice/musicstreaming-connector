name: musiclink
description: "Share songs across music streaming services"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  http: ^1.6.0
  share_plus: ^13.3.0
  sentry_flutter: ^9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#121117"
  adaptive_icon_foreground: assets/icon/foreground.png
  ios: true
  remove_alpha_ios: true
