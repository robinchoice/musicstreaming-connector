name: Mobile

# Every change to the app gets analyze and test. On main: iOS → TestFlight,
# Android → signed AAB as artifact. macOS minutes are free only for public repos.

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']

env:
  FLUTTER_VERSION: 3.47.5
  API_URL: ${{ vars.API_URL }}
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug --dart-define=API_URL=https://example.invalid

  ios-build:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=https://example.invalid

  ios:
    needs: [check, ios-build]
    # Skipped until the variables API_URL, ASC_KEY_ID and ASC_ISSUER_ID and the secret ASC_KEY_P8 exist
    if: github.event_name != 'pull_request' && vars.API_URL != '' && vars.ASC_KEY_ID != ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Wähle: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: ASC-API-Key ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createPrivateKey, sign } from 'node:crypto';
          const key = createPrivateKey(readFileSync(`${process.env.HOME}/.appstoreconnect/private_keys/AuthKey_${process.env.ASC_KEY_ID}.p8`));
          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${encode({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' })}.${encode({ iss: process.env.ASC_ISSUER_ID, iat: now, exp: now + 300, aud: 'appstoreconnect-v1' })}`;
          const signature = sign('sha256', Buffer.from(unsigned), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url');
          for (const path of ['certificates?limit=1', 'profiles?limit=1', 'apps?filter[bundleId]=org.musiclink.prototype']) {
            const response = await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`, {
              headers: { Authorization: `Bearer ${unsigned}.${signature}` },
              signal: AbortSignal.timeout(30000),
            });
            console.log(`Apple ${path.split('?')[0]}: HTTP ${response.status}; server date ${response.headers.get('date')}`);
            if (!response.ok) throw new Error('Apple API authentication preflight failed');
          }
          NODE

      - name: Distribution-Signierung installieren
        env:
          IOS_CERTIFICATE: ${{ secrets.MUSICLINK_IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.MUSICLINK_IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE: ${{ secrets.MUSICLINK_IOS_APP_PROFILE }}
          IOS_SHARE_PROFILE: ${{ secrets.MUSICLINK_IOS_SHARE_PROFILE }}
        run: |
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/musiclink.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/musiclink.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/musiclink.p12" -P "$IOS_CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_APP_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/MusicLink-App.mobileprovision"
          printf '%s' "$IOS_SHARE_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/MusicLink-Share.mobileprovision"

      # Eindeutige, steigende Build-Nummer pro Lauf, TestFlight lehnt Duplikate ab.
      - name: Flutter-Build vorbereiten
        run: flutter build ios --release --no-codesign --dart-define=API_URL=$API_URL --dart-define=SENTRY_DSN=$SENTRY_DSN --build-number=$GITHUB_RUN_NUMBER

      - name: Archive bauen
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive"

      - name: App Groups im Archiv prüfen
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Runner.xcarchive/Products/Applications/Runner.app'
          for bundle in [app, app / 'PlugIns/MusicLinkShare.appex']:
              output = subprocess.check_output(['codesign', '-d', '--entitlements', ':-', str(bundle)], stderr=subprocess.DEVNULL)
              entitlements = plistlib.loads(output)
              assert entitlements.get('com.apple.security.application-groups') == ['group.org.musiclink.prototype'], f'Missing App Group: {bundle.name}'
              print(f'{bundle.name}: App Group entitlement verified')
          PY

      - name: IPA exportieren
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Signierte IPA prüfen
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          ipa, = (root / 'export').glob('*.ipa')
          with zipfile.ZipFile(ipa) as archive:
              archive.extractall(root / 'ipa-check')
          app, = (root / 'ipa-check/Payload').glob('*.app')
          for bundle, identifier in [(app, 'org.musiclink.prototype'), (app / 'PlugIns/MusicLinkShare.appex', 'org.musiclink.prototype.share')]:
              subprocess.run(['codesign', '--verify', '--deep', '--strict', str(bundle)], check=True)
              entitlements = plistlib.loads(subprocess.check_output(['codesign', '-d', '--entitlements', ':-', str(bundle)], stderr=subprocess.DEVNULL))
              assert entitlements['application-identifier'] == f'T2F442364K.{identifier}'
              assert entitlements['com.apple.security.application-groups'] == ['group.org.musiclink.prototype']
              assert not entitlements.get('get-task-allow', False)
              print(f'{bundle.name}: Distribution signature and App Group verified')
          PY

      - name: Upload zu TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP"/export/*.ipa \
            --apiKey '${{ vars.ASC_KEY_ID }}' \
            --apiIssuer '${{ vars.ASC_ISSUER_ID }}'

      - name: Signierung aufräumen
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/musiclink.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/musiclink.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/musiclink.p12" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/MusicLink-App.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/MusicLink-Share.mobileprovision"

  android:
    needs: [check, android-build]
    # Skipped until the variable API_URL exists
    if: github.event_name != 'pull_request' && vars.API_URL != ''
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ohne Secrets wird mit Debug-Keys signiert (nur zum Testen, nicht für Play).
      - name: Upload-Keystore ablegen
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > upload-keystore.jks
          cat > key.properties <<EOT
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOT

      - name: App Bundle bauen
        run: flutter build appbundle --release --dart-define=API_URL=$API_URL --dart-define=SENTRY_DSN=$SENTRY_DSN --build-number=$GITHUB_RUN_NUMBER

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
